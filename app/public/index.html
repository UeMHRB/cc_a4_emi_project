<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan EMI Calculator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
  <h2 class="mb-4">Loan EMI Calculator</h2>
  <div class="row g-4">
    <div class="col-md-5">
      <form id="emiForm" class="card card-body" novalidate>
        <div class="mb-3">
          <label class="form-label" for="principal">Loan amount</label>
          <input type="number" class="form-control" id="principal" min="1" step="any" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="rate">Annual interest rate (%)</label>
          <input type="number" class="form-control" id="rate" min="0.01" step="any" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="months">Tenure (months)</label>
          <input type="number" class="form-control" id="months" min="1" step="1" required>
        </div>
        <div id="formError" class="text-danger mb-2"></div>
        <button type="submit" class="btn btn-primary">Calculate</button>
      </form>
    </div>

    <div class="col-md-7">
      <div id="resultPanel" class="card card-body mb-4 d-none">
        <h5>Result</h5>
        <table class="table table-sm mb-0">
          <tr><th>Monthly EMI</th><td id="rEmi"></td></tr>
          <tr><th>Total payment</th><td id="rTotal"></td></tr>
          <tr><th>Total interest</th><td id="rInterest"></td></tr>
          <tr><th>Served by pod</th><td id="rPod"></td></tr>
          <tr><th>Pod IP</th><td id="rIp"></td></tr>
        </table>
      </div>

      <div class="card card-body">
        <h5>Last 10 calculations</h5>
        <div class="table-responsive">
          <table class="table table-sm table-striped mb-0">
            <thead>
              <tr><th>Time</th><th>Principal</th><th>Rate %</th><th>Months</th><th>EMI</th><th>Pod</th></tr>
            </thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="app.js"></script>
</body>
</html>
